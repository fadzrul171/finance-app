<!doctype html>
<html lang="ms">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance App</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="login" class="auth"><div class="card"><h1>Finance App</h1><p>Login ke akaun kewangan anda</p><input id="loginUser" placeholder="User ID"><input id="loginPass" type="password" placeholder="Password"><button onclick="login()">Login</button><button class="link" onclick="showForgot()">Forgot Password?</button><div id="loginMsg"></div></div></div>
<div id="forgot" class="auth hidden"><div class="card"><h1>Forgot Password</h1><p>Masukkan recovery email anda.</p><input id="forgotEmail" type="email" placeholder="Email"><button onclick="forgot()">Hantar Reset Link</button><button class="link" onclick="showLogin()">Kembali Login</button><div id="forgotMsg"></div></div></div>
<div id="app" class="hidden"><header><div><strong id="companyTitle">Finance App</strong><small id="companySsm"></small></div><div><button onclick="openSettings()">Settings</button><button onclick="logout()">Logout</button></div></header><main>
<section class="stats"><div><span>Income</span><b id="income">RM0.00</b></div><div><span>Expenses</span><b id="expenses">RM0.00</b></div><div><span>Net Profit</span><b id="profit">RM0.00</b></div></section>
<nav><button onclick="showPage('transactions')">Transactions</button><button onclick="showPage('reports')">Reports</button><button onclick="showPage('settings')">Settings</button></nav>
<section id="transactions" class="page"><h2>Transactions</h2><div class="form"><select id="type"><option value="Income">Income</option><option value="Expense">Expense</option></select><input id="date" type="date"><input id="category" placeholder="Category"><input id="description" placeholder="Description"><input id="amount" type="number" step="0.01" placeholder="Amount"><input id="account" placeholder="Account / Bank"><input id="receipt" type="file" accept="image/*,.pdf"><button onclick="saveTx()">Save Transaction</button></div><table><thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th>Amount</th><th>Receipt</th><th></th></tr></thead><tbody id="txBody"></tbody></table></section>
<section id="reports" class="page hidden"><h2>Reports</h2><div id="reportBox"></div></section>
<section id="settings" class="page hidden"><h2>Settings</h2><div class="settingsBox"><h3>Company</h3><input id="companyName" placeholder="Company Name"><input id="ssmNumber" placeholder="SSM Number"><input id="recoveryEmail" type="email" placeholder="Recovery Email"><button onclick="saveSettings()">Save Company Settings</button><hr><h3>Change Password</h3><input id="currentPassword" type="password" placeholder="Current Password"><input id="newPassword" type="password" placeholder="New Password (min 8 chars)"><button onclick="changePassword()">Change Password</button><div id="settingsMsg"></div></div></section>
</main></div>
<script src="app.js"></script></body></html>
